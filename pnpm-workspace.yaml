# pnpm settings (pnpm 11+ reads project settings from here, not package.json)

# Match the installed vite-plus and its bundled test runner when upgrading.
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest@*: 5.0.3

peerDependencyRules:
  allowedVersions:
    # The core alias bundles Vite 8 but reports the Vite+ release version.
    vite: "1.1.0"

# Native deps allowed to run install scripts
onlyBuiltDependencies:
  - esbuild
  - lightningcss
  - sharp
  - workerd

# Resilient install settings (network can be flaky)
fetchRetries: 6
fetchRetryMintimeout: 20000
fetchRetryMaxtimeout: 120000
networkConcurrency: 4
autoInstallPeers: true
minimumReleaseAgeExclude:
  - "@cloudflare/vite-plugin@1.40.0"
  - miniflare@4.20260603.0
  - wrangler@4.98.0
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
